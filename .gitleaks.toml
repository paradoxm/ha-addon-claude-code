# gitleaks, with one thing it is wrong about.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  description = """
  Claude Code's own OAuth client id. It is a public identifier — it travels in every
  authorisation request the CLI makes, and it is worth nothing without the account's
  refresh token, which is not here and never will be.
  """
  regexes = ['''9d1c250a-e61b-44d9-88ed-5944d1962f5e''']
