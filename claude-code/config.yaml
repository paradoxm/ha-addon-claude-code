---
name: Claude Code
version: "1.19.0"
slug: claude_code
description: >-
  Claude Code CLI with a console for talking to it, your own skills, and an HTTP
  API for prompts and jobs. Keeps the CLI up to date by itself.
url: https://github.com/paradoxm/ha-addon-claude-code/tree/main/claude-code
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:robot-outline
panel_title: Claude Code
# `startup`, `boot` and `ingress_port` are left out: each would only repeat Home
# Assistant's own default. The Watchdog option acts on the container's health,
# which the image's HEALTHCHECK reports — see the Dockerfile.
# Only the CLI's own copy, which is ~230 MB, reproducible, and re-downloaded after
# a restore. Everything else is backed up, skills included and whole.
#
# The pattern is two components on purpose: excludes are matched right-anchored
# against the full host path, so a bare `.local` would also have matched a folder
# of that name inside a skill and quietly dropped it from the backup. A bare
# `jobs` had the same problem, and job scratch is tens of megabytes rather than
# hundreds — not worth the risk of touching skill data, so it is no longer
# excluded at all.
backup_exclude:
  - home/.local
ports:
  7682/tcp: null
ports_description:
  7682/tcp: HTTP API for other add-ons. Only listens when api_token is set.
options:
  model: opus
  effort: medium
  permission_mode: manual
  timeout_minutes: 90
  session_threshold: 90
  week_threshold: 90
  guard_limits: true
  usage_check_seconds: 180
  auto_update: true
  update_channel: latest
schema:
  # Aliases rather than pinned ids: each one tracks the newest model of its tier,
  # so this list does not go stale. A job may still send a full model name.
  model: list(opus|sonnet|haiku|fable)
  # What `claude --effort` documents. medium is the CLI's own default.
  effort: list(low|medium|high|xhigh|max)
  # bypassPermissions is deliberately not offered: it removes every check, and
  # this container holds the account credentials.
  permission_mode: list(manual|plan|acceptEdits|auto|dontAsk)
  # No default in `options` on purpose: giving an optional value a default makes
  # it required again.
  api_token: password?
  timeout_minutes: int(5,720)
  # How full each window of the plan's allowance may get before work stops. Two figures
  # because they are not the same question: the five-hour window refills while the day goes
  # on, the week is what a fortnight of work has to fit inside. Reported by GET /usage on
  # each window and summed up in `enough`.
  # Optional, all of them, and the code has the same defaults: an add-on that has been
  # running a while keeps the options it was saved with, and a new *required* option that
  # nobody's file has yet makes the configuration page refuse to save at all — including
  # the change that would have added it.
  session_threshold: int(10,100)?
  week_threshold: int(10,100)?
  guard_limits: bool?
  # How often the account's allowance may be read at all. One number honoured by
  # everything: the answer is cached for this long, the watcher's closest look is never
  # closer than this, and the console asks no more often than this.
  usage_check_seconds: int(30,3600)?
  auto_update: bool
  update_channel: list(latest|stable)
