worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_max_body_size 256m;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # Ingress only. This port is not published in config.yaml, so it is off
        # the LAN, and run.sh fills in the Supervisor's address here so that
        # other add-ons on the internal network cannot reach the UI either.
        listen 8099 default_server;
        __ALLOW__

        root /www;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # The UI is already behind an authenticated Home Assistant session, so
        # the API token is injected here rather than handed to the browser.
        location /api/ {
            proxy_pass http://127.0.0.1:7682/;
            proxy_set_header Authorization "Bearer __API_TOKEN__";
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
        }

        location /terminal/ {
            proxy_pass http://127.0.0.1:7681/terminal/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }
    }
}
