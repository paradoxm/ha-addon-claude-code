worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_max_body_size 256m;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # Ingress only. This port is not published in config.yaml, so it is off
        # the LAN, and run.sh fills in the Supervisor's address here so that
        # other add-ons on the internal network cannot reach the UI either.
        listen 8099 default_server;
        __ALLOW__

        root /www;
        index index.html;

        # Any redirect must stay relative or it would drop the ingress prefix.
        absolute_redirect off;

        # Applies to downloads and the terminal as well; a job artefact must never
        # be sniffed as script.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            # =404 rather than an index.html fallback: this UI has no client-side
            # routes, so the fallback would only dress a missing asset as a 200.
            try_files $uri $uri/ =404;

            # The UI ships inside the add-on and changes with it, and the
            # filenames carry no content hash, so without this a cached copy
            # survives an add-on update and shows the previous interface while the
            # API is already new. "no-cache" means revalidate rather than do not
            # store, so the ETag turns each check into a 304.
            add_header Cache-Control "no-cache" always;

            # Repeated because add_header in a location replaces the inherited set
            # rather than adding to it. The policy stays scoped to our own page:
            # ttyd inlines its scripts, so a server-wide CSP would break the
            # terminal. frame-ancestors is deliberately absent — ingress renders
            # this page in an iframe.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy
                "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'" always;
        }

        # Without this, a hand-typed /terminal would fall through to the 404 above.
        location = /terminal {
            return 301 terminal/;
        }

        # The UI is already behind an authenticated Home Assistant session, so
        # the API token is injected here rather than handed to the browser.
        location /api/ {
            proxy_pass http://127.0.0.1:7682/;
            proxy_set_header Authorization "Bearer __API_TOKEN__";
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
        }

        location /terminal/ {
            proxy_pass http://127.0.0.1:7681/terminal/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }
    }
}
